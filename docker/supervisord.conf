[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[program:shim]
command=node /app/opencode-shim.mjs
directory=/app
autostart=true
autorestart=true
stdout_logfile=/tmp/shim.log
stderr_logfile=/tmp/shim.err
priority=10

[program:gateway]
command=npx tsx src/gateway/server.ts
directory=/app/MemoryCore
autostart=true
autorestart=true
stdout_logfile=/tmp/gw.log
stderr_logfile=/tmp/gw.err
priority=20
environment=TDAI_LLM_BASE_URL="http://127.0.0.1:8899/v1",TDAI_LLM_API_KEY="shim",TDAI_LLM_MODEL="deepseek-v4.1-flash"

[program:knowledge]
command=npx tsx src/server.ts
directory=/app/MemoryKnowledge
autostart=true
autorestart=true
stdout_logfile=/tmp/ks.log
stderr_logfile=/tmp/ks.err
priority=30
environment=LLM_API_KEY="shim"

[program:proxy]
command=npx tsx src/index.ts --config config.yaml
directory=/app/MemoryProxy
autostart=true
autorestart=true
stdout_logfile=/tmp/proxy.log
stderr_logfile=/tmp/proxy.err
priority=40
